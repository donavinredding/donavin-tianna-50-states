<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donavin's and Tianna's 50 State Gallery</title>
  <link rel="icon" type="image/svg+xml" href="./svg/dnt.svg">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="no-scroll">
  <!-- Auth Modal (Open by default) -->
  <div id="auth-modal" class="modal active">
    <div class="modal-content auth-box">
      <h2 id="auth-title">Welcome Back</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password" required />
        <button type="submit" id="auth-submit-btn" class="submit-btn">Log In</button>
      </form>
    </div>
  </div>

  <!-- Gallery Detail Modal -->
  <div id="gallery-modal" class="modal">
    <div class="modal-content gallery-box">
      <button id="close-gallery-btn" class="close-btn">&times;</button>
      <h2 id="gallery-state-title">State Name</h2>
      <div id="gallery-images" class="gallery-grid">
        <!-- State photos dynamically inserted here -->
      </div>
    </div>
  </div>

  <header>
    <h1>Donavin's & Tianna's 50 State Gallery</h1>
    <p class="subtitle">Our Family Journey Across America</p>
  </header>

  <main class="map-container">
    <svg class="us-map" xmlns="http://www.w3.org/2000/svg" height="100%" version="1.1" width="100%" viewBox="-9.74 -4.87 487 299.992" preserveAspectRatio="xMinYMin meet">
      <defs id="state-patterns"></defs>
      <g id="states-group">
        <!-- SVG Path data for US Map states -->
      </g>
    </svg>
  </main>

  <script src="app.js"></script>
</body>

</html>
