<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donavin's and Tianna's 50 State Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4eee1; /* Vintage paper cream */
            --primary-red: #9E2A2B; /* Dark pastel red */
            --primary-green: #4A7C59; /* Dark pastel green */
            --primary-orange: #E09F3E; /* Pastel orange */
            --text-dark: #2b2b2b;
            --polaroid-bg: #ffffff;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Courier Prime', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(#e3dccb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px dashed var(--primary-red);
            padding-bottom: 15px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-family: 'Special Elite', cursive;
            font-size: clamp(1.8rem, 4vw, 3rem);
            color: var(--primary-red);
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--primary-orange);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--primary-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Map Container */
        .map-container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.6);
            border: 4px solid var(--text-dark);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            position: relative;
            margin-bottom: 40px;
        }

        svg.us-map {
            width: 100%;
            height: auto;
            display: block;
        }

        /* SVG State Styling & Interactive States */
        .state {
            fill: var(--primary-green);
            stroke: var(--bg-color);
            stroke-width: 1.5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            transform-origin: center;
        }

        .state:hover {
            fill: var(--primary-orange);
            transform: scale(1.04);
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.3));
            z-index: 10;
        }

        /* Floating Hover Preview Box */
        #hover-preview {
            position: absolute;
            background: var(--polaroid-bg);
            border: 3px solid var(--text-dark);
            padding: 10px 10px 30px 10px;
            box-shadow: var(--shadow);
            width: 160px;
            pointer-events: none;
            display: none;
            z-index: 100;
            transform: rotate(-3deg);
        }

        #hover-preview img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        #hover-preview .preview-title {
            font-family: 'Special Elite', cursive;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
            color: var(--text-dark);
        }

        /* Modal Gallery Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 43, 43, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            border: 5px solid var(--primary-red);
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 8px;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: var(--primary-red);
            color: white;
            border: none;
            font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--text-dark);
        }

        .modal-header {
            font-family: 'Special Elite', cursive;
            font-size: 2rem;
            color: var(--primary-red);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Polaroid Gallery Grid */
        .polaroid-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .polaroid {
            background: var(--polaroid-bg);
            padding: 12px 12px 35px 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid #dcd7cc;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .polaroid:nth-child(odd) {
            transform: rotate(2deg);
        }

        .polaroid:nth-child(even) {
            transform: rotate(-2deg);
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .polaroid p {
            font-family: 'Special Elite', cursive;
            font-size: 0.95rem;
            color: var(--text-dark);
            text-align: center;
            margin-top: 12px;
        }

        footer {
            margin-top: auto;
            font-size: 0.9rem;
            color: var(--primary-red);
            font-family: 'Special Elite', cursive;
            text-align: center;
            padding: 15px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .map-container {
                padding: 10px;
            }
            .modal-content {
                padding: 15px;
            }
        }
    </style>
</head>

        <div id="hover-preview">

    <div id="gallery-modal" class="modal">

            <h2 id="modal-state-title" class="modal-header">State Gallery</h2>
            <div id="polaroid-container" class="polaroid-grid">
                </div>

    <footer>
        <p>&copy; 2026 Donavin & Tianna. Created with family love for GitHub Pages.</p>
    </footer>

    <script>
        // Sample mock data for state memories, images, and descriptions
        const stateGalleries = {
            "California": [
                { img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80", desc: "Yosemite family camping trip!" },
                { img: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=600&q=80", desc: "San Francisco cable car ride." }
            ],
            "Texas": [
                { img: "https://images.unsplash.com/photo-1531219434158-a578ca3275f1?auto=format&fit=crop&w=600&q=80", desc: "Austin barbecue weekend." },
                { img: "https://images.unsplash.com/photo-1508427953056-b00b8d78ebf5?auto=format&fit=crop&w=600&q=80", desc: "San Antonio River Walk." }
            ],
            "New York": [
                { img: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=600&q=80", desc: "Central Park autumn walk." },
                { img: "https://images.unsplash.com/photo-1534430480872-3498386e7856?auto=format&fit=crop&w=600&q=80", desc: "Times Square lights!" }
            ],
            "Florida": [
                { img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80", desc: "Miami beach sunset." },
                { img: "https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?auto=format&fit=crop&w=600&q=80", desc: "Family trip to the Everglades." }
            ]
        };

        // Fallback default images for any state without custom data loaded yet
        const defaultGallery = [
            { img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=600&q=80", desc: "Exploring scenic backroads!" },
            { img: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80", desc: "Unforgettable family memories here." }
        ];

        const states = document.querySelectorAll('.state');
        const hoverPreview = document.getElementById('hover-preview');
        const previewImg = document.getElementById('preview-img');
        const previewTitle = document.getElementById('preview-title');
        
        const modal = document.getElementById('gallery-modal');
        const closeModal = document.getElementById('close-modal');
        const modalStateTitle = document.getElementById('modal-state-title');
        const polaroidContainer = document.getElementById('polaroid-container');

        let intervalId = null;

        // Hover functionality with image cycling/fading
        states.forEach(state => {
            const stateName = state.getAttribute('data-name');
            const data = stateGalleries[stateName] || defaultGallery;

            state.addEventListener('mouseenter', (e) => {
                previewTitle.textContent = stateName;
                let currentIndex = 0;
                previewImg.src = data[currentIndex].img;
                
                hoverPreview.style.display = 'block';
                
                // Cycle images while hovering
                if (data.length > 1) {
                    intervalId = setInterval(() => {
                        currentIndex = (currentIndex + 1) % data.length;
                        previewImg.src = data[currentIndex].img;
                    }, 1500);
                }
            });

            state.addEventListener('mousemove', (e) => {
                hoverPreview.style.left = (e.pageX + 15) + 'px';
                hoverPreview.style.top = (e.pageY - 120) + 'px';
            });

            state.addEventListener('mouseleave', () => {
                hoverPreview.style.display = 'none';
                if (intervalId) clearInterval(intervalId);
            });

            // Click functionality to open Polaroid Modal Gallery
            state.addEventListener('click', () => {
                modalStateTitle.textContent = `${stateName} Gallery`;
                polaroidContainer.innerHTML = '';

                data.forEach(item => {
                    const polaroidDiv = document.createElement('div');
                    polaroidDiv.className = 'polaroid';
                    polaroidDiv.innerHTML = `
                        <img src="${item.img}" alt="${stateName} photo">
                        <p>${item.desc}</p>
                    `;
                    polaroidContainer.appendChild(polaroidDiv);
                });

                modal.classList.add('active');
            });
        });

        // Close modal handlers
        closeModal.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
